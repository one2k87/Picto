# Supabase CLI 설정 (GitHub Actions 자동 배포 전용, 최소 버전)
#
# 주의: Supabase CLI는 `supabase db push`를 실행할 때도 이 파일 전체를
# 검증합니다. 로컬 개발용 전체 템플릿(auth/storage/edge-function 등)을
# 그대로 쓰면, 거기 적힌 env(SECRET_NAME) 값들이 CI에 없어서 실패할 수
# 있습니다. 그래서 스키마 배포에 꼭 필요한 항목만 남겨둡니다.
# (로컬에서 `supabase start`로 전체 스택을 띄우고 싶다면 `supabase init`으로
# 새 config.toml을 받아 참고하세요.)

project_id = "scripto"

[db]
major_version = 17

[db.migrations]
enabled = true
