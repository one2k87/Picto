name: 쿠팡 링크 위치 이동

# 상품 카드가 글 앞(첫 h2 보다 위)에 있어 독자가 해결을 얻기 전에 상품이 나오는 구조를
# 고친다. 어디로 옮길지는 data/link_moves.json 에 글마다 적어 둔다. 수동 실행만.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 계획만(수정 없음)"
        default: "true"
        required: false

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install requests
      - name: 설정 생성
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python build_config.py
      - name: 링크 위치 이동
        env:
          MOVE_DRY: ${{ github.event.inputs.dry_run }}
        run: python scripts/move_link_block.py
