name: 코드 검증 (배포 전 자동 점검)

# 코드를 올릴 때마다 문법·핵심 함수·설정을 자동 점검한다(무료).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (썸네일 테스트용)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 검증용 최소 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: 파이썬 문법 검사 (전체 .py)
        run: |
          python -m py_compile $(git ls-files '*.py')
          echo "✅ 파이썬 문법 OK"

      # 워크플로도 코드다. 2026-10-08: run 블록 안의 여러 줄 파이썬이 YAML 을 깨서
      # daily-blog.yml 전체가 파싱 불가가 됐고, 푸시 5건이 실패 메일로 나갔다.
      - name: 워크플로 YAML 검사
        run: |
          pip install PyYAML >/dev/null
          python scripts/check_workflows.py

      - name: config.json JSON 유효성
        run: python -c "import json; json.load(open('config.json', encoding='utf-8')); print('✅ config.json JSON OK')"

      - name: 대시보드 JS 문법 검사
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("dashboard/index.html").read_text(encoding="utf-8")
          js = "\n".join(s for s in re.findall(r"<script[^>]*>(.*?)</script>", html, re.DOTALL)
                         if "application/ld" not in s)
          pathlib.Path("_app_check.js").write_text(js, encoding="utf-8")
          print("script chars:", len(js))
          PY
          node --check _app_check.js && echo "✅ 대시보드 JS 문법 OK"

      - name: 핵심 함수 스모크 테스트
        run: python tests/smoke_test.py
