name: 글 휴지통으로 보내기

# 수동 전용. 영구 삭제는 하지 않는다(휴지통은 관리자에서 되돌릴 수 있다).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "휴지통으로 보낼 글 ID (쉼표). 예: 878,879,880"
        required: true
      apply:
        description: "true 면 실제로 보냄(비우면 계획만)"
        default: "false"
        required: false

jobs:
  trash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 설정 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_STATUS: ${{ secrets.WP_STATUS }}
        run: python build_config.py
      - name: 실행
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python scripts/trash_posts.py "${{ github.event.inputs.ids }}" --apply
          else
            python scripts/trash_posts.py "${{ github.event.inputs.ids }}"
          fi
