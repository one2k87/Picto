name: 유행템 아이템 페이지·톱3 비교 글

# 수동 전용. data/trend_items.json 에 적힌 품목만 만든다.
# 초안(기본)은 커밋하지 않고 로그로만 확인하고, publish=true 일 때 워드프레스에 올린다.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "true 면 워드프레스에 발행(비우면 초안만)"
        default: "false"
        required: false
      only:
        description: "한 품목만 처리할 때 그 키(비우면 전체). 예: 자동디스펜서"
        default: ""
        required: false
      compare_only:
        description: "true 면 톱3 비교 글만(아이템 페이지는 다음 차례로)"
        default: "false"
        required: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install requests
      - name: 설정 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEY_PAID: ${{ secrets.LLM_API_KEY_PAID }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_STATUS: ${{ secrets.WP_STATUS }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python build_config.py
      - name: 생성
        run: |
          ARGS=""
          [ "${{ github.event.inputs.publish }}" = "true" ] && ARGS="--publish"
          [ "${{ github.event.inputs.compare_only }}" = "true" ] && ARGS="$ARGS --compare-only"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          python scripts/trend_item_pages.py $ARGS
      - name: 한글 폰트 설치
        # 대표 이미지에 제목이 한글로 들어간다. 폰트가 없으면 글자가 통째로 빠진다
        # (2026-11-13 에 같은 누락으로 라이브 9장이 빈 배경으로 나갔다).
        if: ${{ github.event.inputs.publish == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
        timeout-minutes: 5
        continue-on-error: true
      - name: 대표 이미지 올리기
        if: ${{ github.event.inputs.publish == 'true' }}
        run: pip install pillow numpy -q && python scripts/make_featured.py --upload
      - name: 발행 기록 커밋
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          git config user.name  "picto-bot"
          git config user.email "picto-bot@users.noreply.github.com"
          git add data/trend_item_posts.json || true
          git diff --cached --quiet || git commit -m "유행템 아이템 페이지 발행 기록"
          git push || true
