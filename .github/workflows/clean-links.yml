name: 외부 링크 정리

# 기발행 글에서 '남의 사이트' 링크를 걷어낸다.
#  - 구 도메인(one2k.mycafe24.com) → pickdam.com 주소 교체(같은 사이트)
#  - 원더랜드(wontheland.com) → 링크 해제(글자는 남김) / 링크만 든 상자는 제거
# dry_run=true로 먼저 계획을 확인하는 것을 권장한다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행 최대 글 수"
        default: "100"
        required: false
      dry_run:
        description: "true면 계획만 출력(수정 없음)"
        default: "true"
        required: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install requests
      - name: 설정 생성
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python build_config.py
      - name: 링크 정리
        env:
          CLEAN_LIMIT: ${{ github.event.inputs.limit }}
          CLEAN_DRY: ${{ github.event.inputs.dry_run }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/clean_foreign_links.py
