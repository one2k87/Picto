name: 콕픽 블록 소급 삽입

# 수동 전용. 기발행 글 본문 끝에 <!--KOKPICK …--> 주석 + 글 메타 kokpick 을 넣는다.
# 캐스토(콕픽 유튜브)가 조건분기·설치규격·유지비·주의점을 지어내지 않게 하는 장치(브리프 6-C).
# 9/8 이후 발행분은 파이프라인이 이미 넣으므로 대상은 그 이전 글이다.
# 안전: 본문에서 '실제로 쓰여 있는 내용만' 추출한다. alt_uses(용도 외 활용)는 근거가 없어 항상 비운다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 계획만 출력(글 수정 없음)"
        default: "true"
        required: false
      limit:
        description: "이번 실행 최대 글 수"
        default: "100"
        required: false
      force:
        description: "true면 이미 블록이 있는 글도 다시 만든다"
        default: "false"
        required: false

jobs:
  kokpick:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install -r requirements.txt
      - name: 설정 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python build_config.py
      - name: 콕픽 블록 삽입
        env:
          KOKPICK_DRY: ${{ github.event.inputs.dry_run }}
          KOKPICK_LIMIT: ${{ github.event.inputs.limit }}
          KOKPICK_FORCE: ${{ github.event.inputs.force }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/backfill_kokpick.py
