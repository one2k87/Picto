name: 상품 후보 발굴(수요·경쟁)

# 수동 전용. 대장에 넣을 쿠팡 상품 후보를 검색량·경쟁도·클릭수로 줄 세운다.
# 지금까지 상품을 감으로 골랐고, 그 결과 실제 검색어가 월 20회인 제품도 대장에 있었다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install -r requirements.txt
      - name: 설정 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          DEMAND_MIN_VOLUME: ${{ vars.DEMAND_MIN_VOLUME }}
          DEMAND_MAX_VOLUME: ${{ vars.DEMAND_MAX_VOLUME }}
        run: python build_config.py
      - name: 후보 발굴
        run: python scripts/product_scout.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "picto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/product_scout.json || true
          git diff --cached --quiet || git commit -m "상품 후보 발굴 ($(date +%F\ %H:%M) KST)"
          git pull --rebase -q || true
          git push -q || true
