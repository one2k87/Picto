name: 글 섹션 소급 삽입

# 수동 전용. data/post_patches/*.json 에 적어 둔 섹션을 기발행 글에 넣는다.
# 신설 계기(2026-10-02): 전략 엔진이 "#63에 구독 vs 할부 비교를 넣어라"는 액션을 냈는데
# 워드프레스 비밀값이 GitHub 시크릿에만 있어 반영 통로가 없었다.
# 재실행 안전: 패치의 marker 가 본문에 있으면 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 계획만 출력(수정 없음)"
        default: "true"
        required: false
      only:
        description: "특정 패치 파일만 (파일명 일부, 비우면 전체)"
        default: ""
        required: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install requests
      - name: 설정 생성
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python build_config.py
      - name: 섹션 삽입
        env:
          PATCH_DRY: ${{ github.event.inputs.dry_run }}
          PATCH_ONLY: ${{ github.event.inputs.only }}
        run: python scripts/patch_posts.py
