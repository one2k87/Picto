name: 검색 수요 신호 확인

# 수동 전용. 수요 게이트가 실제로 쓸 만한 신호를 받는지 눈으로 확인한다.
# 게이트를 켜 두고 신호를 본 적이 없으면 좋은 주제를 조용히 버리게 된다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install -r requirements.txt
      - name: 설정 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python build_config.py
      - name: 인증 진단(403 원인 가르기)
        run: python scripts/demand_auth_check.py || true
      - name: 수요 신호 조회
        run: python scripts/demand_probe.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "picto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/demand_probe.json dashboard/data/demand_auth_check.json || true
          git diff --cached --quiet || git commit -m "검색 수요 신호 확인 ($(date +%F\ %H:%M) KST)"
          git pull --rebase -q || true
          git push -q || true
