name: 주간 유행템 리포트

# 매주 목요일 아침 (KST) — cron 시각은 '투입 시각'이지 발행 시각이 아니다.
# 실측: GitHub Actions 예약 실행은 30회 중앙값 141분 지연(최소 35·최대 219, 실패 0).
# 00:37 UTC = 09:37 KST 투입 → 실제 발행은 대개 11:00~13:00 KST.
# 분을 0으로 두지 않는 이유: 정시는 전 세계 큐가 몰려 지연이 더 커진다.
on:
  schedule:
    - cron: "37 0 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 선정·미리보기만(링크 요청 블록 출력), false면 발행까지"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  trend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성(최소)
        run: pip install requests
      - name: config.json 생성
        env:
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_STATUS: ${{ secrets.WP_STATUS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python build_config.py
      - name: 유행템 리포트 선정·발행
        env:
          # 신호 층: 네이버 검색광고(월간 검색량) — 이미 배포된 키. 없으면 이 층만 빠진다.
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          # 기준가 층: 공공데이터포털 「한국소비자원 생필품 가격 정보」. 없으면 기준가 줄만 빠진다.
          PRICE_REF_API_KEY: ${{ secrets.PRICE_REF_API_KEY }}
          # 쿠팡 파트너스 오픈API는 누적 수익 15만 원 달성 후에야 발급된다(2026-09 확인).
          # 그때 아래 두 줄을 켜면 coupang_api.py 가 그대로 동작한다.
          # COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          # COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/weekly_trend_report.py --publish
          else
            python scripts/weekly_trend_report.py
          fi
      - name: 미리보기 올려두기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-report-preview
          path: |
            data/trend_report_preview.html
            data/weekly_trend_pick.json
          if-no-files-found: ignore
